# @partme.ai/openclaw-prometheus configuration — OpenClaw 2026.7.1

path: /metrics
collectIntervalMs: 15000
snapshotIntervalMs: 30000
workloadWindowMs: 300000
collectorTimeoutMs: 10000
maxScrapeSeries: 10000
includeRuntime: true

monitoredProviders:
  - openai
  - anthropic

instance: ""

scrapeAuth:
  enabled: false
