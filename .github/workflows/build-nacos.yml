name: Build Nacos

on:
  workflow_dispatch:
  push:
    branches: [main, feature/*]
    paths:
      - "extensions/nacos/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/build-nacos.yml"

permissions:
  contents: read

concurrency:
  group: build-nacos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @partme.ai/openclaw-nacos typecheck

      - name: Build
        run: pnpm --filter @partme.ai/openclaw-nacos build

      - name: Test
        run: pnpm --filter @partme.ai/openclaw-nacos test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-nacos-dist
          path: extensions/nacos/dist/
          if-no-files-found: error
          retention-days: 7
