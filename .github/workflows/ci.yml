name: CI

on:
  push:
    branches: [main, feature/*]
    paths: ["extensions/**", "scripts/**", "doc/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["extensions/**", "scripts/**", "doc/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: detect
        run: |
          PLUGINS=$(node scripts/ci-detect.mjs --json --base origin/main)
          echo "plugins=$PLUGINS" >> $GITHUB_OUTPUT
          echo "Detected: $PLUGINS"

  plugin-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Structure inventory (warn mode)
        run: node scripts/check-plugin-structure.mjs --strict-base --strict-new

      - name: Release metadata gate
        run: |
          pnpm check-release-readiness
          pnpm test:release-scripts

      - name: Chinese comments and visual documentation gate
        run: pnpm check-explanatory-assets

      - name: E2E harness contract tests
        run: pnpm test:e2e:harness

  build-and-test:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependency
        run: pnpm --filter @partme.ai/openclaw-message-sdk build

      - name: Type check
        run: pnpm --dir extensions/${{ matrix.plugin }} run --if-present typecheck

      - name: Unit tests
        run: pnpm --dir extensions/${{ matrix.plugin }} run --if-present test

      - name: Build
        run: pnpm --dir extensions/${{ matrix.plugin }} run --if-present build

      - name: Package archive verification
        run: node scripts/check-package-archives.mjs --plugin "${{ matrix.plugin }}"
