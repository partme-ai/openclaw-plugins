name: Publish Changed

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Publish a single plugin (leave empty to publish all changed)"
        required: false
      dry_run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release gates
        run: |
          pnpm check-release-readiness
          pnpm test:release-scripts
          node scripts/check-plugin-structure.mjs --strict-base --strict-new
          pnpm check-explanatory-assets
          pnpm test:e2e:harness
          pnpm typecheck
          pnpm test:unit
          pnpm build
          pnpm check-package-archives

      - name: Publish
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$PLUGIN" ]; then
            args+=(--plugin "$PLUGIN")
          fi
          node scripts/publish-changed.mjs "${args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLUGIN: ${{ inputs.plugin }}
